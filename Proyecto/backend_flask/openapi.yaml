# AgroAsesor API v0.3 · lectura de terreno detrás de la puerta de enlace de Django
openapi: 3.0.3
info:
  title: AgroAsesor API - lectura de terreno y catálogo
  version: 0.3.0
  description: 'Servicio interno de AgroAsesor. Los usuarios, contraseñas y sesiones son SOLO de Django: el navegador
    llama a /api/v1/... en Django, que valida la sesión y reenvía la petición a esta API con cabeceras firmadas
    (HMAC-SHA256). Esta API lee la base oficial en modo SOLO LECTURA y nunca escribe en ella. Las operaciones de
    escritura siguen devolviendo 501 hasta su fase.'
servers:
- url: http://localhost:5050/api/v1
paths:
  /health:
    get:
      tags:
      - Sistema
      summary: Estado de la API y de la conexión de solo lectura
      responses:
        '200':
          description: 'API activa; base_datos: no_configurada | no_disponible | conectada_solo_lectura'
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  servicio:
                    type: string
                  version:
                    type: string
                  base_datos:
                    type: string
  /auth/registro:
    post:
      tags:
      - Auth
      summary: Registrar usuario (pendiente)
      description: 'Ruta reservada: devuelve HTTP 501. No se han implementado operaciones ni persistencia.'
      responses:
        '501':
          description: Funcionalidad todavía no implementada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: false
        content:
