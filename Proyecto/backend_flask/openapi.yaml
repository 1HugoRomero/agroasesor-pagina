        name: product_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Ficha del producto
        '404':
          description: No encontrado
  /catalogo/referencias-siembra:
    get:
      tags:
      - Catálogo
      summary: Rangos de siembra documentados por INIA
      responses:
        '200':
          description: Referencias contextualizadas
  /catalogo/calcular-sacos:
    post:
      tags:
      - Catálogo
      summary: Calcula cantidad de sacos para semilla usando dosis elegida por usuario
      description: No es un cálculo de plaguicidas ni recomendación agronómica. La dosis debe estar dentro del rango
        INIA.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - referencia_id
              - peso_saco_kg
              - dosis_kg_ha
              properties:
                referencia_id:
                  type: string
                  example: trigo-invierno
                superficie_ha:
                  type: number
                  exclusiveMinimum: 0
                  example: 1.5
                superficie_m2:
                  type: number
                  exclusiveMinimum: 0
                peso_saco_kg:
                  type: number
                  exclusiveMinimum: 0
                  example: 25
                dosis_kg_ha:
                  type: number
                  exclusiveMinimum: 0
                  example: 180
                precio_saco_clp:
                  type: number
                  exclusiveMinimum: 0
                  description: Precio informado por el usuario, no precio oficial
              additionalProperties: false
      responses:
        '200':
          description: Cálculo orientativo con fuente
        '400':
          description: Datos inválidos
        '415':
          description: Se requiere JSON
  /calculos:
    get:
      tags:
      - Cálculos
      summary: Historial de cálculos del usuario
      description: 'Solo lectura. Filtros opcionales: potrero_id, limite (1-200).'
      security: *id001
      parameters:
      - name: potrero_id
        in: query
        schema:
          type: integer
          minimum: 1
      - name: limite
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      responses:
        '200':
          description: Historial
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Sin autenticación válida o firma vencida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Base de datos o clave interna no configuradas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /openapi.json:
    get:
      tags:
      - Sistema
      summary: Esta especificación en JSON
      responses:
        '200':
          description: OpenAPI 3.0.3
components:
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - codigo
          - mensaje
          properties:
            codigo:
              type: string
            mensaje:
              type: string
            modulo:
              type: string
            operacion:
              type: string
  securitySchemes:
    gatewayAuth:
      type: apiKey
      in: header
      name: X-AgroAsesor-Signature
      description: Firma HMAC-SHA256 generada por Django junto con X-AgroAsesor-User, -Staff y -Timestamp. No es
        una credencial de navegador.
