{% load static %}
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Recuperar acceso · AgroAsesor</title><link rel="stylesheet" href="{% static 'css/login.css' %}"></head>
<body class="access-body"><main class="access-panel"><h1>Recuperar acceso</h1>
{% if form %}<form method="post" class="access-form">{% csrf_token %}{{ form.as_p }}<button class="submit" type="submit">{% if validlink %}Guardar contraseña{% else %}Enviar instrucciones{% endif %}</button></form>
{% else %}<p>El enlace es inválido o venció. Solicita uno nuevo.</p><a href="{% url 'password_reset' %}">Solicitar enlace</a>{% endif %}
<p><a href="{% url 'login' %}">Volver al inicio de sesión</a></p></main></body></html>
