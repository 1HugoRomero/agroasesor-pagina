<div class="field{% if wide %} span-2{% endif %}{% if field.errors %} has-error{% endif %}"
     {% if attrs %} {{ attrs }}{% endif %}>
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="req" aria-hidden="true">*</span>{% endif %}</label>
    {{ field }}
    {% if help %}<small class="help">{{ help }}</small>{% elif field.help_text %}<small class="help">{{ field.help_text }}</small>{% endif %}
    {% for error in field.errors %}<small class="error" role="alert">{{ error }}</small>{% endfor %}
</div>
